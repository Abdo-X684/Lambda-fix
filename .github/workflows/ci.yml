name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Full verification (python + C++ + generation + offline merge + package)
        run: make verify
      - name: CMake build (optional toolchain)
        run: |
          make build-cmake
          ./build/cmake/speedrun_test
      - name: Upload offline merge report + package manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kit-artifacts
          path: |
            build/merged/MERGE_REPORT.*
            dist/MANIFEST.json

  sdk-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch pinned upstream SDKs (checksum verified)
        run: make fetch
      - name: Merge the real SDKs
        run: make merge
      - name: Syntax-check injected code against real SDK headers + no conflict markers
        run: python3 tools/verify_sdk.py --tree build/merged-real
      - name: Fail the build on any remaining conflict / deferred port
        run: |
          python3 - <<'PY'
          import json
          r = json.load(open('build/merged-real/MERGE_REPORT.json'))
          s = r['summary']
          assert s['errors'] == 0 and s['anchor_drift'] == 0, s
          assert s['conflicts'] == 0 and s['deferred'] == 0, s
          assert s['audited'] == 3, s
          print('real merge clean:', s)
          PY
      - name: Verify the Linux DLL build inputs (structure, no toolchain needed)
        run: |
          python3 tools/build_dlls.py --check --require-tree --out dist/dlls
      - name: Reproduce the Linux32 binaries with Zig (no multilib, no vgui.so)
        run: |
          python3 -m pip install --quiet ziglang
          python3 tools/build_dlls_zig.py
          python3 - <<'PY'
          import json
          m = json.load(open('dist/dlls/MANIFEST.json'))
          assert all(f['elf32'] for f in m['files'].values()), m
          print('reproduced ELF32 binaries:', m['files'])
          PY
      - name: Build distributable overlay package
        run: make package
      - name: Upload real merge report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-merge-report
          path: build/merged-real/MERGE_REPORT.*
