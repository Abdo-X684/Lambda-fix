name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify the BHL-based merge tree (provenance + compiled OP4 sources)
        run: make verify-bhl-base
      - name: Full verification (python + C++ + generation + offline merge + package)
        run: make verify
      - name: CMake build (optional toolchain)
        run: |
          make build-cmake
          ./build/cmake/speedrun_test
      - name: Upload offline merge report + package manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
            name: kit-artifacts
            path: |
              build/merged/MERGE_REPORT.*
              dist/MANIFEST.json
              bhl-op4/PROVENANCE.json
              bhl-op4/PORT_STATUS.json

  bhl-base-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Zig (32-bit cross compiler, no multilib needed)
        run: |
          python3 -m pip install --quiet ziglang
          ZIG_BIN=$(python3 -c 'import ziglang, pathlib; print(pathlib.Path(ziglang.__file__).parent / "zig")')
          printf '#!/bin/sh\nexec %s c++ -target x86-linux-gnu "$@"\n' "$ZIG_BIN" > /tmp/zig32
          chmod +x /tmp/zig32
      - name: Compile OP4 subsystem sources against the merged BHL headers
        run: |
          python3 tools/verify_bhl_base.py --compile
          python3 - <<'PY'
          import json
          s = json.load(open('bhl-op4/PORT_STATUS.json'))
          assert s['status'] == 'compiled', s
          weapons = {k: v for k, v in s['files'].items()
                     if k.startswith('src/game/server/op4/dlls/weapons/')}
          assert len(weapons) == 15, len(weapons)
          assert all(v['ok'] for v in weapons.values()), [
              k for k, v in weapons.items() if not v['ok']]
          bhl = s['bhl_base']
          assert bhl['total'] >= 106, bhl['total']
          assert bhl['clean'] >= 100, bhl['clean']
          glue = s['client_glue']
          assert glue['total'] >= 1 and glue['clean'] == glue['total'], glue
          prov = json.load(open('bhl-op4/PROVENANCE.json'))
          assert prov['base']['verbatim_files'] == 678
          assert prov['base']['merged_files'] == 16
          assert prov['base']['files'] == 694
          print('BHL-base OP4 weapons:', len(weapons), '/', len(weapons), 'ELF32 objects')
          print('verbatim BHL server sources:', bhl['clean'], '/', bhl['total'])
          print('OP4 overall:', s['clean'], '/', s['total'], 'clean')
          PY
      - name: Verify provenance and CMake-wired sources
        run: make verify-bhl-base
      - name: Upload provenance + port status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bhl-base-reports
          path: |
            bhl-op4/PROVENANCE.json
            bhl-op4/PORT_STATUS.json

  sdk-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch pinned upstream SDKs (checksum verified)
        run: make fetch
      - name: Merge the real SDKs
        run: make merge
      - name: Syntax-check injected code against real SDK headers + no conflict markers
        run: python3 tools/verify_sdk.py --tree build/merged-real
      - name: Fail the build on any remaining conflict / deferred port
        run: |
          python3 - <<'PY'
          import json
          r = json.load(open('build/merged-real/MERGE_REPORT.json'))
          s = r['summary']
          assert s['errors'] == 0 and s['anchor_drift'] == 0, s
          assert s['conflicts'] == 0 and s['deferred'] == 0, s
          assert s['audited'] == 3, s
          print('real merge clean:', s)
          PY
      - name: Verify the Linux DLL build inputs (structure, no toolchain needed)
        run: |
          python3 tools/build_dlls.py --check --require-tree --out dist/dlls
      - name: Reproduce the Linux32 binaries with Zig (no multilib, no vgui.so)
        run: |
          python3 -m pip install --quiet ziglang
          python3 tools/build_dlls_zig.py
          python3 - <<'PY'
          import json
          m = json.load(open('dist/dlls/MANIFEST.json'))
          assert all(f['elf32'] for f in m['files'].values()), m
          print('reproduced ELF32 binaries:', m['files'])
          PY
      - name: Build distributable overlay package
        run: make package
      - name: Upload real merge report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-merge-report
          path: build/merged-real/MERGE_REPORT.*
