name: Build OP4-based BugfixedHL server DLL (opfor)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  server:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/dd30bd22-bugfixhl-speedrun-op4
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch pinned upstreams and generate the OP4-based BHL tree
        shell: pwsh
        run: |
          python -m merge.cli fetch
          python tools/build_op4_bhl.py --out build/op4bhl

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build opfor.dll (server) from the OP4-based BHL tree with MSVC/Win32
        shell: pwsh
        run: |
          msbuild build/op4bhl/projects/vs2019/projects.sln /t:hldll /p:Configuration=Release /p:Platform=Win32 /m /nologo
          $dll = Get-ChildItem -Path build/op4bhl/projects/vs2019 -Recurse -Filter opfor.dll | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          if (-not $dll) { $dll = Get-ChildItem -Path build/op4bhl/projects/vs2019 -Recurse -Filter opfor.dll | Select-Object -First 1 }
          if (-not $dll) { throw "opfor.dll was not produced" }
          New-Item -ItemType Directory -Force -Path build-evidence/op4-bhl-server | Out-Null
          Copy-Item $dll.FullName build-evidence/op4-bhl-server/opfor.dll -Force

      - name: Check PE loader shape
        shell: pwsh
        run: |
          python -m pip install --quiet pefile
          python tools/check_msvc_pe.py build-evidence/op4-bhl-server/opfor.dll

      - name: Upload opfor.dll
        uses: actions/upload-artifact@v4
        with:
          name: op4-bhl-server-dll
          path: build-evidence/op4-bhl-server/
          if-no-files-found: error

      - name: Publish opfor.dll to the working branch
        shell: pwsh
        run: |
          $branch = 'arena/dd30bd22-bugfixhl-speedrun-op4'
          git config user.name "arena-bot"
          git config user.email "arena-bot@users.noreply.github.com"
          git add -f build-evidence/op4-bhl-server/opfor.dll
          if (git diff --cached --quiet) {
            Write-Host "No opfor.dll changes to publish"
          } else {
            git commit -m "Build OP4-based BugfixedHL server DLL (opfor)"
            git pull --rebase origin $branch
            git push origin "HEAD:$branch"
          }
