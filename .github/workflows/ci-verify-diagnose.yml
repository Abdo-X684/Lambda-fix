name: Diagnose CI verify failure

# Mirrors the "verify" job of ci.yml and commits its full log, because the
# job log itself is not readable from outside GitHub.

on:
  workflow_dispatch:
  push:
    branches:
      - arena/dd30bd22-bugfixhl-speedrun-op4
    paths:
      - .github/workflows/ci-verify-diagnose.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/dd30bd22-bugfixhl-speedrun-op4
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch pinned sources
        run: make fetch

      - name: Run make verify and keep the full log
        run: |
          mkdir -p build-evidence/ci-diagnose
          set +e
          make verify > build-evidence/ci-diagnose/verify.log 2>&1
          echo "make verify exit code: $?" | tee -a build-evidence/ci-diagnose/verify.log
          python3 -c "import sys; print(sys.version)" >> build-evidence/ci-diagnose/verify.log
          uname -a >> build-evidence/ci-diagnose/verify.log
          git --version >> build-evidence/ci-diagnose/verify.log
          exit 0

      - name: Commit the log
        run: |
          git config user.name "arena-bot"
          git config user.email "arena-bot@users.noreply.github.com"
          git add -f build-evidence/ci-diagnose/verify.log
          if git diff --cached --quiet; then
            echo "no log change"
          else
            git commit -m "CI verify diagnostic log"
            git pull --rebase origin arena/dd30bd22-bugfixhl-speedrun-op4
            git push origin HEAD:arena/dd30bd22-bugfixhl-speedrun-op4
          fi
