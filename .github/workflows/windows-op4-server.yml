name: Build full OP4 server DLL

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  opfor:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/4b36a45d-lambda-fix
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch pinned upstreams and prepare the patched OP4 server tree
        shell: pwsh
        run: |
          python -m merge.cli fetch
          python tools/prepare_op4_msvc_server.py --out build/op4-msvc

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build opfor.dll from the full OP4 SDK with MSVC/Win32
        shell: pwsh
        run: |
          msbuild build/op4-msvc/projects/vs2019/projects.sln /t:hldll /p:Configuration=Release /p:Platform=Win32 /m /nologo
          $dll = Get-ChildItem -Path build/op4-msvc/projects/vs2019 -Recurse -Filter opfor.dll | Select-Object -First 1
          if (-not $dll) { throw "opfor.dll was not produced" }
          New-Item -ItemType Directory -Force -Path build-evidence/bhl-windows | Out-Null
          Copy-Item $dll.FullName build-evidence/bhl-windows/opfor.dll -Force

      - name: Check PE loader shape
        shell: pwsh
        run: |
          python -m pip install --quiet pefile
          python tools/check_msvc_pe.py build-evidence/bhl-windows/opfor.dll

      - name: Upload opfor.dll
        uses: actions/upload-artifact@v4
        with:
          name: opfor-dll
          path: build-evidence/bhl-windows/opfor.dll
          if-no-files-found: error

      - name: Publish opfor.dll to the working branch
        shell: pwsh
        run: |
          $branch = 'arena/4b36a45d-lambda-fix'
          git config user.name "arena-bot"
          git config user.email "arena-bot@users.noreply.github.com"
          git add -f build-evidence/bhl-windows/opfor.dll
          if (git diff --cached --quiet) {
            Write-Host "No opfor.dll changes to publish"
          } else {
            git commit -m "Build full OP4 server DLL with BHL systems and all-ten impulse 101"
            git pull --rebase origin $branch
            git push origin "HEAD:$branch"
          }
