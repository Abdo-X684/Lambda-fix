name: Publish full OP4 package

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/4b36a45d-lambda-fix

      - name: Attach the full-OP4 mod ZIP to a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: bhl-op4-full-20261111
        run: |
          python3 tools/audit_op4_sources.py
          files="build-evidence/bhl-base/bhl-base-mod.zip build/docs/OP4_SOURCE_AUDIT.md build/docs/OP4_RUNTIME_TESTS.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber
          else
            gh release create "$TAG" $files \
              --target arena/4b36a45d-lambda-fix \
              --title "BugfixedHL + full Opposing Force campaign" \
              --notes "OP4 campaign/server with BHL VGUI2 client. Run setup_op4_media.bat before launch. Source fixes for OP4 prediction/HUD and merged BHL+OP4 delta are included. NOT in-game tested here; no weapon or music row is marked successful."
          fi
          gh release edit "$TAG" --notes "OP4 campaign/server with BHL VGUI2 client. Run setup_op4_media.bat before launch. Source fixes for OP4 prediction/HUD and merged BHL+OP4 delta are included. NOT in-game tested here; no weapon or music row is marked successful."
          gh release view "$TAG" --json assets
