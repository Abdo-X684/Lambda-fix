name: Publish full OP4 package

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/dd30bd22-bugfixhl-speedrun-op4

      - name: Attach the full-OP4 mod ZIP to a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: bhl-op4-full-20261111
        run: |
          files="build-evidence/bhl-base/bhl-base-mod.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber
          else
            gh release create "$TAG" $files \
              --target arena/dd30bd22-bugfixhl-speedrun-op4 \
              --title "BugfixedHL + full Opposing Force campaign" \
              --notes "OP4 campaign/server (of0a0) with BHL VGUI2 client, BHL UTF-16LE menus, all-ten OP4 prediction, and patched impulse 101. Not in-game tested here."
          fi
          gh release view "$TAG" --json assets
