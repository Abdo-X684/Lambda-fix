name: Publish Linux32 release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: false
        default: 'v0.1.0-linux32'
  push:
    branches: ['arena/4b36a45d-lambda-fix']
    paths: ['.github/RELEASE_TRIGGER']
    tags: ['v*-linux32']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/4b36a45d-lambda-fix

      - name: Verify the ELF32 binaries against MANIFEST.json
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          dlls = Path('dist/dlls')
          m = json.loads((dlls / 'MANIFEST.json').read_text(encoding='utf-8'))
          for name, info in m['files'].items():
              data = (dlls / name).read_bytes()
              assert data[:5] == b'\x7fELF\x01', f'{name}: not ELF32'
              assert len(data) == info['bytes'], f'{name}: size mismatch'
              assert hashlib.sha256(data).hexdigest() == info['sha256'], f'{name}: sha256 mismatch'
              print(f'OK {name}: {len(data)} bytes, ELF32, sha256 verified')
          PY

      - name: Verify real BugfixedHL systems are compiled into the binaries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          client = (Path('dist/dlls') / 'client.so').read_bytes()
          server = (Path('dist/dlls') / 'hl.so').read_bytes()
          for marker in (b'hud_speedometer', b'hud_jumpspeed', b'hud_strafeguide',
                         b'bhl_status', b'bhl_version', b'bugfixedhl.cfg',
                         b'BugfixedHL systems merged'):
              assert marker in client, f'client.so: missing BHL system {marker!r}'
          for marker in (b'sv_bhl_query_vars', b'sv_bhl_defer_motd',
                         b'BugfixedHL server systems'):
              assert marker in server, f'hl.so: missing BHL system {marker!r}'
          print('OK: real BugfixedHL systems are present in both ELF32 binaries')
          PY

      - name: Build the standalone mod folder + zip
        run: python3 tools/create_mod.py

      - name: Attach the binaries to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || 'v0.1.0-linux32' }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/bhl-op4-mod.zip dist/dlls/client.so dist/dlls/hl.so dist/dlls/MANIFEST.json --clobber
            gh release edit "$TAG" --notes-file .github/release-notes.md \
              --title "BHL × OP4 — BugfixedHL systems merged (bhl-systems-1)"
          else
            gh release create "$TAG" \
              dist/bhl-op4-mod.zip dist/dlls/client.so dist/dlls/hl.so dist/dlls/MANIFEST.json \
              --target arena/4b36a45d-lambda-fix \
              --title "BHL × OP4 Speedrun — client.so + hl.so (Linux 32-bit)" \
              --notes-file .github/release-notes.md
          fi
          gh release view "$TAG" --json name,assets
