name: Diagnose MSVC client.dll load under Wine

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/4b36a45d-lambda-fix
          persist-credentials: true

      - name: Install 32-bit Wine and a MinGW compiler
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq wine32:i386 gcc-mingw-w64-i686
          python3 -m pip install --quiet --break-system-packages pefile

      - name: Download original BugfixedHL client package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.13.2 --repo tmp64/BugfixedHL-Rebased --pattern 'BugfixedHL-1.13.2-client.zip' --dir /tmp
          unzip -o /tmp/BugfixedHL-1.13.2-client.zip -d /tmp/bhl-upstream
          mkdir -p wineenv
          find /tmp/bhl-upstream -iname '*.dll' -exec cp {} wineenv/ \;
          cp "$(find /tmp/bhl-upstream -iname client.dll | head -1)" wineenv/client_orig.dll
          cp build-evidence/bhl-windows/client.dll wineenv/client.dll
          ls -l wineenv | head -30

      - name: Generate a Win32 loader that checks every import
        run: |
          python3 - <<'PY'
          import json, pefile, pathlib
          pe = pefile.PE('build-evidence/bhl-windows/client.dll')
          checks = []
          for e in pe.DIRECTORY_ENTRY_IMPORT:
              dll = e.dll.decode()
              for imp in e.imports:
                  if imp.name:
                      checks.append((dll, imp.name.decode()))
          lines = [
              '#include <windows.h>',
              '#include <stdio.h>',
              '#ifndef LOAD_WITH_ALTERED_SEARCH_PATH',
              '#define LOAD_WITH_ALTERED_SEARCH_PATH 0x00000008',
              '#endif',
              'struct Check { const char *dll; const char *sym; };',
              'static const struct Check checks[] = {',
          ]
          for dll, sym in checks:
              lines.append('    {%s, %s},' % (json.dumps(dll), json.dumps(sym)))
          lines.extend([
              '    {NULL, NULL}',
              '};',
              'int main(int argc, char **argv) {',
              '    if (argc > 1) SetDllDirectoryA(argv[1]);',
              '    for (const struct Check *c = checks; c->dll; ++c) {',
              '        SetLastError(0);',
              '        HMODULE h = LoadLibraryA(c->dll);',
              '        if (!h) { printf("LOADFAIL %s %lu\\n", c->dll, GetLastError()); continue; }',
              '        SetLastError(0);',
              '        FARPROC p = GetProcAddress(h, c->sym);',
              '        if (!p) printf("SYMFAIL %s %s %lu\\n", c->dll, c->sym, GetLastError());',
              '    }',
              '    SetLastError(0);',
              '    HMODULE c = NULL;',
              '    if (argc > 2) c = LoadLibraryExA(argv[2], NULL, LOAD_WITH_ALTERED_SEARCH_PATH);',
              '    else c = LoadLibraryA("client.dll");',
              '    printf("CLIENT %p %lu\\n", (void *)c, GetLastError());',
              '    return 0;',
              '}',
          ])
          pathlib.Path('wine_loader.c').write_text('\n'.join(lines) + '\n')
          print('generated checks:', len(checks))
          PY
          i686-w64-mingw32-gcc -mconsole -O0 -o wine_loader.exe wine_loader.c -lkernel32

      - name: Run the loader under 32-bit Wine
        run: |
          export WINEARCH=win32
          export WINEPREFIX=/tmp/wineprefix
          export WINEDEBUG=+loaddll
          WINEDEBUG=-all wineboot -u >/dev/null 2>&1 || true
          mkdir -p "$WINEPREFIX/drive_c/windows/system32"
          cp wineenv/*.dll "$WINEPREFIX/drive_c/windows/system32/" || true
          wine_dir="$(winepath -w "$PWD/wineenv")"
          client_path="$(winepath -w "$PWD/wineenv/client.dll")"
          (WINEDEBUG=+loaddll wine wine_loader.exe "$wine_dir" "$client_path" > wine_output.txt 2>&1 || true)
          echo '=== summary ==='
          grep -iE 'LOADFAIL|SYMFAIL|CLIENT|err:|failed|not found' wine_output.txt | tail -60 || true
          mkdir -p build-evidence/bhl-windows
          cp wine_output.txt build-evidence/bhl-windows/WINE_LOAD_REPORT.txt

      - name: Push the Wine load diagnostic
        run: |
          git config user.name "arena-bot"
          git config user.email "arena-bot@users.noreply.github.com"
          git add build-evidence/bhl-windows/WINE_LOAD_REPORT.txt
          git commit -m "Add Wine load diagnostic for MSVC-ABI build" || echo "no changes"
          git pull --rebase origin arena/4b36a45d-lambda-fix
          git push origin HEAD:arena/4b36a45d-lambda-fix
