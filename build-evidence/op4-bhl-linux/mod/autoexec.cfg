// Full OP4 campaign with BugfixedHL client. Executed at startup.
sv_cheats 1
sv_oldweapons 0
alias op4all "exec op4weapons.cfg"
bind F9 "op4all"
bind F10 "give weapon_penguin"
echo "BHL+OP4: New Game starts of0a0; F9 gives all ten OP4 weapons + ammo"
bind F8 "bhls_settings"
echo "BHLS: F8 opens BHLS Settings (English in-game menu)"
